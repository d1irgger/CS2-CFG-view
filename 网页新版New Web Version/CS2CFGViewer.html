<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS2 CFG Viewer v4.1.0</title>
<style>
:root{--ink:#1a1d29;--ink2:#4a4f5c;--ink3:#7a7f8c;--glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.72);--border:rgba(255,255,255,.75)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:var(--ink);background:linear-gradient(135deg,#e6ecf7 0%,#f2eefb 45%,#fbeaf2 100%);min-height:100vh;overflow:hidden;position:relative;user-select:none}
body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;filter:blur(80px);z-index:0}
body::before{top:-15vh;left:-12vw;width:55vw;height:55vh;background:radial-gradient(circle,rgba(120,170,255,.45),transparent 70%)}
body::after{bottom:-20vh;right:-12vw;width:55vw;height:55vh;background:radial-gradient(circle,rgba(255,150,220,.42),transparent 70%)}
.app{position:relative;z-index:1;height:100vh;padding:14px;display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;max-width:1440px;margin:0 auto}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--border);border-radius:18px;box-shadow:0 10px 40px rgba(31,38,135,.08),inset 0 1px 0 rgba(255,255,255,.7)}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:34px;height:34px;border-radius:8px;background:url('https://developer.valvesoftware.com/w/images/5/52/Cs2_icon.png') center/cover no-repeat;box-shadow:0 4px 12px rgba(31,38,135,.2);flex-shrink:0}
.brand h1{font-size:15px;font-weight:700;margin:0}
.brand .ver{font-size:11px;color:var(--ink3);margin-left:6px;font-weight:500}
.header .links{display:flex;gap:8px}
.header .links a{font-size:12px;text-decoration:none;color:var(--ink2);padding:6px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--border);transition:all .18s}
.header .links a:hover{background:rgba(255,255,255,.9);color:var(--ink)}
.toolbar{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.path-display{flex:1;min-width:220px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.9);color:var(--ink2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path-display.placeholder{color:#9aa0ad;font-style:italic}
button,select{font-family:inherit;font-size:12px;padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.9);background:var(--glass2);color:var(--ink);cursor:pointer;transition:all .15s;font-weight:500;white-space:nowrap}
button:hover{background:rgba(255,255,255,.95);transform:translateY(-1px);box-shadow:0 4px 12px rgba(31,38,135,.1)}
button:active{transform:translateY(0)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.primary{background:linear-gradient(135deg,#6aa0ff,#a98bff);color:#fff;border-color:rgba(255,255,255,.6)}
button.primary:hover{background:linear-gradient(135deg,#5f96ff,#9c7cff)}
button.danger{background:linear-gradient(135deg,#ff7a9c,#ff5f7e);color:#fff;border-color:rgba(255,255,255,.6)}
button.danger:hover{background:linear-gradient(135deg,#ff6b8e,#ff4a6d)}
select{padding-right:30px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#6b7080 50%),linear-gradient(135deg,#6b7080 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select option{color:var(--ink);background:#fff}
.content{display:flex;flex-direction:column;overflow:hidden;min-height:0}
.tabs{display:flex;align-items:center;gap:4px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.6);flex-shrink:0}
.tabs button{padding:7px 14px;border-radius:9px;background:transparent;border:1px solid transparent;color:var(--ink3);font-weight:500}
.tabs button:hover{background:rgba(255,255,255,.6);transform:none;box-shadow:none}
.tabs button.active{background:rgba(255,255,255,.92);color:var(--ink);border-color:rgba(255,255,255,.95);box-shadow:0 2px 8px rgba(31,38,135,.08);font-weight:600}
.tabs .search{margin-left:auto;padding:7px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.9);background:var(--glass2);font-size:12px;width:260px;font-family:inherit;outline:none;transition:all .15s}
.tabs .search:focus{background:rgba(255,255,255,.98);border-color:rgba(140,150,255,.5);box-shadow:0 0 0 3px rgba(140,150,255,.15)}
.tabs .search::placeholder{color:#9aa0ad}
.tab-body{flex:1;overflow:auto;min-height:0}
.tab-panel{display:none;height:100%}
.tab-panel.active{display:block}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);text-align:left;font-weight:600;color:var(--ink2);padding:10px 14px;border-bottom:1px solid rgba(0,0,0,.06);font-size:11.5px;letter-spacing:.4px;text-transform:uppercase}
tbody td{padding:8px 14px;border-bottom:1px solid rgba(0,0,0,.035);vertical-align:top;word-break:break-word}
tbody tr:hover{background:rgba(255,255,255,.5)}
tbody td.mono{font-family:"SF Mono","Cascadia Code","Consolas",monospace;font-size:11.5px;color:#3b4050}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10.5px;font-weight:600;background:rgba(140,150,255,.15);color:#5c5fd8}
.tag.miss{background:rgba(255,140,140,.18);color:#c95050}
.empty{display:flex;align-items:center;justify-content:center;height:100%;min-height:200px;color:#9aa0ad;font-style:italic;font-size:13px;padding:40px;text-align:center}
#rawContent{padding:14px;height:100%;overflow:auto}
#diagContent{font-family:"SF Mono","Cascadia Code","Consolas",monospace;font-size:12px;color:#3b4050;line-height:1.6;white-space:pre-wrap;background:rgba(255,255,255,.4);border-radius:12px;margin:14px;padding:16px;border:1px solid rgba(255,255,255,.6);height:calc(100% - 28px);overflow:auto}
.raw-block{margin-bottom:14px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8)}
.raw-block h4{margin:0;padding:8px 14px;font-size:12px;font-weight:600;color:var(--ink2);background:rgba(255,255,255,.75);border-bottom:1px solid rgba(0,0,0,.05)}
.raw-block pre{margin:0;padding:12px 14px;font-family:"SF Mono","Cascadia Code","Consolas",monospace;font-size:11.5px;line-height:1.5;color:#333a48;white-space:pre;overflow:auto;max-height:420px}
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:12px;flex-shrink:0}
.statusbar .summary{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.online-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0}
#onlineProgress{font-family:"SF Mono","Consolas",monospace;font-size:11.5px;color:var(--ink3);min-width:60px;text-align:right}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.28);background-clip:padding-box;border:2px solid transparent}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,34,46,.92);color:#fff;padding:10px 20px;border-radius:12px;font-size:12.5px;opacity:0;transition:all .25s;z-index:1000;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#overlay{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;background:rgba(20,24,36,.35);backdrop-filter:blur(6px)}
#overlay.show{display:flex}
#overlay .box{background:rgba(255,255,255,.94);border-radius:16px;padding:22px 32px;box-shadow:0 20px 60px rgba(0,0,0,.2);font-size:13px;color:var(--ink);min-width:240px;text-align:center}
#overlay .box .spinner{width:30px;height:30px;margin:0 auto 12px;border:3px solid rgba(110,140,255,.2);border-top-color:#6aa0ff;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <header class="glass header">
    <div class="brand">
      <div class="logo"></div>
      <h1>CS2 CFG Viewer<span class="ver">v4.1.0</span></h1>
    </div>
    <div class="links">
      <a href="https://github.com/d1irgger/CS2-CFG-view" target="_blank" rel="noreferrer">GitHub</a>
      <a href="https://t.me/timharrys" target="_blank" rel="noreferrer">Telegram</a>
    </div>
  </header>

  <section class="glass toolbar">
    <div class="row">
      <button id="btnPickDir" class="primary" title="推荐直接选择 Steam\userdata 目录（更快）">📁 选择 Steam / userdata 目录</button>
      <button id="btnPickFiles" title="手动选择 machine_convars / user_convars / user_keys / video 文件">📂 手动加载配置文件</button>
      <button id="btnImportAutoexec">📄 导入 autoexec.cfg</button>
      <button id="btnImportCvarlist" title="从 SuGolYolLom/CS2-Cvars-Cmds 或 ArmynC/ArminC-CS2-Cvars 下载 cvarlist.md 后导入">📥 导入 cvarlist.md</button>
      <div id="pathDisplay" class="path-display placeholder">选择 Steam 目录，或用 ProSettings 下载解析 autoexec</div>
    </div>
    <div class="row">
      <span style="font-size:12px;color:var(--ink3);">数据源：</span>
      <select id="sourceSelect" style="min-width:320px;">
        <option value="">— 尚无可用数据源 —</option>
      </select>
      <button id="btnReload">🔄 加载</button>
    </div>
  </section>

  <section class="glass content">
    <nav class="tabs">
      <button data-tab="keys" class="active">按键绑定</button>
      <button data-tab="video">设置项</button>
      <button data-tab="raw">原始文本</button>
      <button data-tab="diag">诊断</button>
      <input type="text" id="search" class="search" placeholder="🔍 搜索（按键 / 命令 / 设置项）...">
    </nav>
    <div class="tab-body">
      <div id="tab-keys" class="tab-panel active">
        <div class="empty" id="keys-empty">还没有载入任何配置</div>
        <table id="keys-table" style="display:none;">
          <thead><tr>
            <th style="width:80px;">源</th><th style="width:180px;">按键</th>
            <th style="width:150px;">按键中文</th><th style="width:34%;">命令</th>
            <th>命令中文</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="tab-video" class="tab-panel">
        <div class="empty" id="video-empty">还没有载入任何配置</div>
        <table id="video-table" style="display:none;">
          <thead><tr>
            <th style="width:24%;">设置项</th><th style="width:24%;">设置项中文</th>
            <th style="width:90px;">值</th><th style="width:22%;">值中文</th>
            <th>官方英文描述</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="tab-raw" class="tab-panel">
        <div id="rawContent" class="empty">还没有载入任何配置</div>
      </div>
      <div id="tab-diag" class="tab-panel">
        <pre id="diagContent">还没有载入任何配置</pre>
      </div>
    </div>
  </section>

  <footer class="glass statusbar">
    <span class="summary" id="summary">还没有载入任何配置</span>
    <div class="online-ctrl">
      <span id="onlineProgress">0/0</span>
      <button id="btnStartOnline">🌐 开始联网翻译</button>
      <button id="btnStopOnline" class="danger" disabled>⏹ 停止</button>
    </div>
  </footer>
</div>

<div id="toast"></div>
<div id="overlay"><div class="box"><div class="spinner"></div><div id="overlayMsg">正在扫描…</div></div></div>

<input type="file" id="dirInput" webkitdirectory directory multiple hidden>
<input type="file" id="filesInput" multiple accept=".vcfg,.txt,.cfg" hidden>
<input type="file" id="autoexecInput" accept=".cfg,.txt" hidden>
<input type="file" id="cvarlistInput" accept=".md,.txt" hidden>

 * 设置项名称字典

/* ============================================================

function normalizeKeyName(name){
  if(!name) return "";
  let n = String(name).trim();
  if(n.toLowerCase().startsWith("key_")) n = n.slice(4);
  return n.toLowerCase();
}
function lookup(dic, key){
  if(!key) return null;
  if(Object.prototype.hasOwnProperty.call(dic, key)) return dic[key];
  const lower = key.toLowerCase();
  if(Object.prototype.hasOwnProperty.call(dic, lower)) return dic[lower];
  if(key[0]==="+" || key[0]==="-"){
    const base = key.slice(1);
    if(Object.prototype.hasOwnProperty.call(dic, base)) return dic[base];
    if(Object.prototype.hasOwnProperty.call(dic, base.toLowerCase())) return dic[base.toLowerCase()];
  }
  return null;
}
function translateKeyLocal(key){ return KEY_NAME_CN[normalizeKeyName(key)] ?? null; }
function translateVideoKeyLocal(key){
  if(!key) return null;
  if(VIDEO_NAME_CN[key] !== undefined) return VIDEO_NAME_CN[key];
  if(key.startsWith("setting.")){
    const k = key.slice(8);
    if(VIDEO_NAME_CN[k] !== undefined) return VIDEO_NAME_CN[k];
  }
  if(VIDEO_NAME_CN["setting."+key] !== undefined) return VIDEO_NAME_CN["setting."+key];
  return null;
}
function translateVideoValueLocal(key, value){
  if(key==null || value==null) return null;
  const sv = String(value);
  let dic = VIDEO_VALUE_CN[key];
  if(!dic && key.startsWith("setting.")) dic = VIDEO_VALUE_CN[key.slice(8)];
  if(!dic) dic = VIDEO_VALUE_CN["setting."+key];
  if(dic && dic[sv] !== undefined) return dic[sv];
  const low = sv.toLowerCase();
  if(low==="true") return "开启";
  if(low==="false") return "关闭";
  return null;
}
const SPLIT_RE = /[\s;]+/;
function translateCmdLocal(cmd){
  if(!cmd) return null;
  const hit = lookup(CMD_NAME_CN, cmd);
  if(hit) return hit;
  const parts = cmd.trim().split(SPLIT_RE).filter(p=>p);
  if(parts.length <= 1) return null;
  const translated = [];
  for(const p of parts){
    const cn = lookup(CMD_NAME_CN, p) || translateVideoKeyLocal(p);
    if(!cn) return null;
    translated.push(cn);
  }
  return translated.join(" + ");
}
function cleanVideoKeyForTranslation(key){
  let k = key || "";
  if(k.startsWith("setting.")) k = k.slice(8);
  return k.replace(/\./g," ").replace(/_/g," ").trim();
}

/* ============================================================
 * cfg 解析
 * ============================================================ */
function tokenizeCfgLine(line){
  const tokens = [];
  let i = 0;
  const n = line.length;
  while(i < n){
    const c = line[i];
    if(c===" "||c==="\t"){ i++; }
    else if(c==='"'){
      i++;
      const chars = [];
      while(i < n && line[i] !== '"'){
        if(line[i]==="\\" && i+1 < n){ chars.push(line[i+1]); i+=2; }
        else { chars.push(line[i]); i++; }
      }
      if(i < n) i++;
      tokens.push(chars.join(""));
    }
    else if(c==="/" && i+1 < n && line[i+1]==="/"){ break; }
    else if(c===";"){ break; }
    else {
      const start = i;
      while(i < n && line[i] !== " " && line[i] !== "\t"){
        if(line[i]==="/" && i+1 < n && line[i+1]==="/") break;
        if(line[i]===";") break;
        i++;
      }
      tokens.push(line.slice(start, i));
    }
  }
  return tokens;
}
const SKIP_CMDS = new Set(["echo","exec","clear","host_writeconfig","unbind","unbindall","alias"]);
function parseAutoexecCfg(text){
  const binds = [], settings = [];
  for(const rawLine of text.split(/\r?\n/)){
    const line = rawLine.trim();
    if(!line || line.startsWith("//")) continue;
    const tokens = tokenizeCfgLine(line);
    if(!tokens.length) continue;
    const cmd = tokens[0];
    const cmdLower = cmd.toLowerCase();
    const args = tokens.slice(1);
    if(cmdLower === "bind"){
      if(args.length >= 2) binds.push([args[0], args.slice(1).join(" ")]);
      continue;
    }
    if(SKIP_CMDS.has(cmdLower)) continue;
    if(args.length){
      settings.push([cmd, args.length > 1 ? args.join(" ") : args[0]]);
    }
  }
  return { binds, settings };
}
function dedupeSettings(items){
  const lastVal = {};
  for(const [name, value] of items) lastVal[name] = value;
  const seen = new Set();
  const out = [];
  for(const [name] of items){
    if(seen.has(name)) continue;
    seen.add(name);
    out.push([name, lastVal[name]]);
  }
  return out;
}

/* ============================================================
 * VDF 解析
 * ============================================================ */
class VDFParser {
  constructor(text){ this.text = text; this.pos = 0; this.length = text.length; }
  parse(){
    const result = {};
    while(this.pos < this.length){
      this.skipWs();
      if(this.pos >= this.length) break;
      if(this.peek() === '"'){
        const key = this.readString();
        this.skipWs();
        result[key] = this._readValue();
      } else this.pos++;
    }
    return result;
  }
  parseBlock(){
    this.expect("{");
    const result = {};
    while(true){
      this.skipWs();
      if(this.pos >= this.length) break;
      if(this.peek() === "}"){ this.pos++; break; }
      if(this.peek() === '"'){
        const key = this.readString();
        this.skipWs();
        result[key] = this._readValue();
      } else this.pos++;
    }
    return result;
  }
  _readValue(){
    const c = this.peek();
    if(c === "{") return this.parseBlock();
    if(c === '"') return this.readString();
    return this.readToken();
  }
  skipWs(){
    const text = this.text, n = this.length;
    while(this.pos < n){
      const c = text[this.pos];
      if(c===" "||c==="\t"||c==="\r"||c==="\n") this.pos++;
      else if(c==="/" && this.pos+1 < n && text[this.pos+1]==="/"){
        const nl = text.indexOf("\n", this.pos);
        this.pos = nl === -1 ? n : nl;
      } else break;
    }
  }
  peek(){ return this.pos < this.length ? this.text[this.pos] : ""; }
  expect(ch){
    if(this.pos < this.length && this.text[this.pos] === ch) this.pos++;
    else throw new Error("Expected '"+ch+"' at "+this.pos);
  }
  readString(){
    this.expect('"');
    const text = this.text, n = this.length;
    const chars = [];
    while(this.pos < n){
      const c = text[this.pos];
      if(c === "\\"){ this.pos++; if(this.pos < n){ chars.push(text[this.pos]); this.pos++; } }
      else if(c === '"'){ this.pos++; break; }
      else { chars.push(c); this.pos++; }
    }
    return chars.join("");
  }
  readToken(){
    const start = this.pos, text = this.text, n = this.length;
    while(this.pos < n && !' \t\r\n{}"'.includes(text[this.pos])) this.pos++;
    return text.slice(start, this.pos);
  }
}
function findSection(data, name){
  if(!data || typeof data !== "object") return null;
  if(data[name] && typeof data[name] === "object") return data[name];
  for(const v of Object.values(data)){
    if(v && typeof v === "object"){
      const res = findSection(v, name);
      if(res) return res;
    }
  }
  return null;
}
function collectLeaves(data, out, prefix=""){
  if(data && typeof data === "object"){
    for(const [k, v] of Object.entries(data)){
      if(v && typeof v === "object") collectLeaves(v, out, prefix+k+".");
      else out[prefix+k] = v;
    }
  } else out[prefix] = data;
}

/* ============================================================
 * 文件读取（多编码回退）
 * ============================================================ */
async function readTextWithFallback(file){
  const buf = await file.arrayBuffer();
  const encodings = ["utf-8","utf-16le","utf-16be","gbk","gb18030","big5","shift_jis","latin1"];
  for(const enc of encodings){
    try {
      const dec = new TextDecoder(enc, { fatal: true });
      return dec.decode(buf);
    } catch(_) { /* 换下一个 */ }
  }
  return new TextDecoder("utf-8", { fatal: false }).decode(buf);
}

/* ============================================================
 * 文件查找
 * ============================================================ */
function findFileInList(files, keywords, exts){
  const kwLower = keywords.map(k=>k.toLowerCase());
  const extLower = exts.map(e=>e.toLowerCase());
  let best = null, bestRank = [extLower.length, Infinity];
  for(const f of files){
    const nameLower = f.name.toLowerCase();
    let extRank = -1;
    for(let i=0;i<extLower.length;i++){ if(nameLower.endsWith(extLower[i])){ extRank = i; break; } }
    if(extRank < 0) continue;
    if(!kwLower.every(kw=>nameLower.includes(kw))) continue;
    const rank = [extRank, f.name.length];
    if(rank[0] < bestRank[0] || (rank[0] === bestRank[0] && rank[1] < bestRank[1])){
      bestRank = rank; best = f;
    }
  }
  return best;
}

/* ============================================================
 * cvarlist.md 解析（兼容 SuGolYolLom / ArmynC 格式）
 * 返回 { name: "英文描述" }
 * ============================================================ */
function parseCvarlistMarkdown(text){
  const map = {};
  for(const rawLine of text.split(/\r?\n/)){
    const line = rawLine.trim();
    if(!line || line.startsWith("#") || line.startsWith("Name |")) continue;
    if(/^\|?[\s\-:|]+\|?$/.test(line)) continue;
    let parts = line.split("|").map(s=>s.trim());
    if(parts.length < 3){ parts = line.split("\t").map(s=>s.trim()); }
    if(parts.length < 3) continue;
    if(parts[0] === "") parts.shift();
    if(parts.length && parts[parts.length-1] === "") parts.pop();
    if(parts.length < 3) continue;
    const name = parts[0];
    if(!name) continue;
    if(name.startsWith("+") || name.startsWith("-")) continue;
    let desc = parts.slice(2).join(" ").trim();
    desc = desc.replace(/FCVAR_[\w,|]+/g, "").trim();
    desc = desc.replace(/^\*\*Default:\*\*\s*\S+\s*/i, "").trim();
    desc = desc.replace(/^Default:\s*\S+\s*/i, "").trim();
    desc = desc.replace(/^[-–—\s:]+/, "").trim();
    if(desc.length > 3 && /[a-zA-Z]/.test(desc)){
      map[name.toLowerCase()] = desc;
    }
  }
  return map;
}

/* ============================================================
 * Steam 扫描
 * ============================================================ */
function steamId64ToAccountId(steamid64){
  try { return (BigInt(steamid64) - 76561197960265728n).toString(); }
  catch(_) { return ""; }
}
function scanSteamUsers(fileMap){
  const users = new Map();
  const re = /(?:^|\/)userdata\/([^/]+)\/730\/(?:local\/)?cfg\/([^/]+)$/i;
  const cfgFiles = [];
  for(const [, file] of fileMap){
    const rel = (file.webkitRelativePath || file.name).replace(/\\/g,"/");
    const m = rel.match(re);
    if(m) cfgFiles.push({ accountId: m[1], name: m[2], file });
  }
  if(cfgFiles.length === 0){
    for(const [, file] of fileMap){
      const rel = (file.webkitRelativePath || file.name).replace(/\\/g,"/");
      const m2 = rel.match(/(?:^|\/)(?:local\/)?cfg\/([^/]+)$/i);
      if(m2) cfgFiles.push({ accountId: "(unknown)", name: m2[1], file });
    }
  }
  for(const {accountId, name, file} of cfgFiles){
    if(!users.has(accountId)) users.set(accountId, { account_id: accountId, display: accountId, files: [] });
    users.get(accountId).files.push({ name, file });
  }
  let loginUsersFile = null;
  for(const [, file] of fileMap){
    const rel = (file.webkitRelativePath || file.name).replace(/\\/g,"/");
    if(/\/config\/loginusers\.vdf$/i.test(rel)){ loginUsersFile = file; break; }
    if(/^config\/loginusers\.vdf$/i.test(rel)){ loginUsersFile = file; break; }
  }
  return { users: [...users.values()], loginUsersFile };
}

/* ============================================================
 * 数据源加载
 * ============================================================ */
const FILE_SPECS = {
  machine_convars: { keywords: ["machine_convars"], exts: [".vcfg",".txt"] },
  user_convars:    { keywords: ["user_convars"],    exts: [".vcfg",".txt"] },
  user_keys:       { keywords: ["user_keys"],       exts: [".vcfg",".txt"] },
  video:           { keywords: ["video"],           exts: [".txt",".vcfg"] }
};

function processConvarData(data){
  let section = null;
  for(const sec of ["convars","ConVars","convars_localized"]){
    section = findSection(data, sec);
    if(section) break;
  }
  if(!section){
    const tmp = {};
    collectLeaves(data, tmp);
    section = {};
    for(const [k, v] of Object.entries(tmp)){
      const kl = k.toLowerCase();
      if(!kl.endsWith("name") && !kl.endsWith("version")) section[k] = v;
    }
  }
  return section;
}
function processUserKeysData(data){
  const keyItems = [];
  let section = null;
  for(const sec of ["bindings","Bindings","Keys","keys"]){
    section = findSection(data, sec);
    if(section) break;
  }
  if(section){
    for(const [k, v] of Object.entries(section)){
      if(typeof v !== "object") keyItems.push(["按键", k, v]);
    }
  }
  let analog = null;
  for(const sec of ["analogbindings","AnalogBindings"]){
    analog = findSection(data, sec);
    if(analog) break;
  }
  if(analog){
    for(const [k, v] of Object.entries(analog)){
      if(typeof v !== "object") keyItems.push(["模拟绑定", k, v]);
    }
  }
  return keyItems;
}
function processVideoData(data){
  let inner = data;
  for(const v of Object.values(data)){
    if(v && typeof v === "object"){ inner = v; break; }
  }
  const tmp = {};
  collectLeaves(inner, tmp);
  const out = [];
  for(const [k, v] of Object.entries(tmp)){
    if(k.toLowerCase().endsWith("name")) continue;
    if(typeof v !== "object") out.push([k, v]);
  }
  return out;
}

async function loadCs2ConfigsFromEntries(cfgFiles, sourceDesc){
  const result = {
    convar_items: [], key_items: [], video_items: [],
    raw_texts: {}, found_paths: {}, errors: [],
    cfg_dir: sourceDesc || "(手动文件)", source_desc: sourceDesc || ""
  };
  const fileObjects = cfgFiles.map(x => x.file);
  for(const [name, spec] of Object.entries(FILE_SPECS)){
    const file = findFileInList(fileObjects, spec.keywords, spec.exts);
    if(!file){
      if(name !== "video") result.errors.push("没找到 *"+spec.keywords[0]+"* 文件（试过 "+spec.exts.join(", ")+"）");
      continue;
    }
    result.found_paths[name] = file.name;
    try {
      const text = await readTextWithFallback(file);
      result.raw_texts[name] = text;
      const data = new VDFParser(text).parse();
      if(name === "machine_convars" || name === "user_convars"){
        const section = processConvarData(data);
        const source = name === "machine_convars" ? "机器配置" : "用户配置";
        for(const [k, v] of Object.entries(section)){
          if(typeof v !== "object") result.convar_items.push([source, k, v]);
        }
      } else if(name === "user_keys"){
        result.key_items.push(...processUserKeysData(data));
      } else if(name === "video"){
        result.video_items.push(...processVideoData(data));
      }
    } catch(e){
      result.errors.push("解析 "+file.name+" 时出错："+(e.message || e));
    }
  }
  return result;
}

/* ============================================================
 * 视图构建
 * ============================================================ */
function makeKey(source, key, value){
  const key_cn = translateKeyLocal(key) || "";
  const value_cn = translateCmdLocal(value) || "";
  return { source, key, key_cn, value, value_cn, trans: (key_cn && value_cn) ? "本地" : "" };
}
function makeVideo(key, value){
  let key_cn = lookupDescCN(key) || translateVideoKeyLocal(key) || "";
  const value_cn = translateVideoValueLocal(key, value) || "";
  const desc_en = lookupDescEN(key) || "";
  return { key, key_cn, value: String(value), value_cn, desc_en, trans: key_cn ? "本地" : "" };
}
function buildDiagnosis(src){
  if(!src) return "还没有载入任何配置";
  const lines = ["CS2 CFG Viewer v4.1.0", ""];
  if(src.type === "vcfg"){
    lines.push("vcfg 数据源");
    lines.push("  配置目录：" + (src.cfg_dir || ""));
    if(src.source_desc) lines.push("  来源：" + src.source_desc);
    lines.push("  文件：");
    const paths = Object.entries(src.found_paths || {});
    if(paths.length){ for(const [n, p] of paths) lines.push("    ["+n+"] "+p); }
    else lines.push("    （没有找到文件）");
    if(src.errors && src.errors.length){
      lines.push("  提示：");
      for(const e of src.errors) lines.push("    - "+e);
    }
  } else {
    lines.push("autoexec 数据源");
    lines.push("  文件：" + (src.filename || src.path || ""));
    lines.push("  按键绑定：" + src.binds_count + " 条");
    lines.push("  设置项：" + src.settings_count + " 条（已去重）");
  }
  lines.push("");
  lines.push("描述库状态：");
  lines.push("  中文描述（预翻译）：" + Object.keys(CONVAR_DESC_CN).length + " 条");
  lines.push("  英文描述（增强翻译）：" + Object.keys(CONVAR_DESC_EN).length + " 条");
  return lines.join("\n");
}
function buildView(src){
  if(!src){
    return { ok:true, convar:[], keys:[], video:[], raw:[],
             summary:"还没有载入任何配置", source_type:null,
             diagnosis:"还没有载入任何配置" };
  }
  let convar, keys, video, raw, head;
  if(src.type === "vcfg"){
    convar = src.convar.map(x=>x.slice());
    keys = src.key.map(x=>makeKey(x[0], x[1], x[2]));
    video = src.video.map(x=>makeVideo(x[0], x[1]));
    raw = Object.entries(src.raw_texts).map(([name, text])=>({ name, text }));
    head = "vcfg " + Object.keys(src.found_paths).length + " 个文件";
  } else {
    convar = [];
    keys = src.key.map(x=>makeKey(x[0], x[1], x[2]));
    video = src.video.map(x=>makeVideo(x[0], x[1]));
    raw = [{ name: "autoexec ("+src.filename+")", text: src.raw_text }];
    head = "autoexec " + src.binds_count + " 按键、" + src.settings_count + " 项设置";
  }
  const miss_k = keys.filter(it=>!it.key_cn || !it.value_cn).length;
  const miss_v = video.filter(it=>!it.key_cn).length;
  const summary = "完成 · " + head + " · " + convar.length + " 配置 · " +
                  keys.length + " 按键（" + miss_k + " 未收录）· " +
                  video.length + " 设置（" + miss_v + " 未收录）";
  return {
    ok: true, convar, keys, video, raw, summary,
    source_type: src.type,
    diagnosis: buildDiagnosis(src)
  };
}

async function applyVcfgSource(cfgFiles, sourceDesc){
  const result = await loadCs2ConfigsFromEntries(cfgFiles, sourceDesc);
  state.source = {
    type: "vcfg",
    convar: result.convar_items.map(x=>x.slice()),
    key: result.key_items.map(x=>x.slice()),
    video: result.video_items.map(x=>x.slice()),
    raw_texts: { ...result.raw_texts },
    found_paths: { ...result.found_paths },
    errors: result.errors.slice(),
    cfg_dir: result.cfg_dir,
    source_desc: sourceDesc
  };
  state.view = buildView(state.source);
  renderAll();
}
async function loadSelectedSource(){
  const val = $("#sourceSelect").value;
  if(!val){ showToast("请先选择 Steam 目录或导入 autoexec"); return; }
  if(val === "autoexec"){
    if(!state.autoexecFile){ showToast("还没有导入 autoexec"); return; }
    try {
      const text = await readTextWithFallback(state.autoexecFile);
      const parsed = parseAutoexecCfg(text);
      const binds = parsed.binds;
      const settings = dedupeSettings(parsed.settings);
      state.source = {
        type: "autoexec",
        key: binds.map(x=>["按键", x[0], x[1]]),
        video: settings.map(x=>[x[0], x[1]]),
        raw_text: text,
        filename: state.autoexecFile.name,
        binds_count: binds.length,
        settings_count: settings.length
      };
      state.view = buildView(state.source);
      renderAll();
      showToast("已载入 autoexec：" + binds.length + " 按键 / " + settings.length + " 设置");
    } catch(e){ showToast("读取 autoexec 失败：" + (e.message || e)); }
    return;
  }
  if(val.startsWith("user:")){
    const idx = parseInt(val.slice(5), 10);
    const user = state.users[idx];
    if(!user){ showToast("账户索引无效"); return; }
    showOverlay("正在解析账户 " + user.account_id + " …");
    try {
      await applyVcfgSource(user.files, "账户 " + user.account_id);
      hideOverlay();
      showToast("已载入账户 " + user.account_id);
    } catch(e){
      hideOverlay();
      showToast("加载失败：" + (e.message || e));
    }
  }
}

function handleDirFiles(fileList){
  const files = Array.from(fileList || []);
  if(!files.length){ showToast("没有选择任何文件"); return; }
  if(files.length > 100000){
    showToast("目录文件过多（"+files.length+" 个），建议直接选择 userdata 目录", 4000);
  }
  showOverlay("正在扫描 " + files.length + " 个文件…");
  const map = new Map();
  for(const f of files){
    const rel = (f.webkitRelativePath || f.name).replace(/\\/g,"/");
    map.set(rel.toLowerCase(), f);
  }
  state.fileMap = map;
  const first = (files[0].webkitRelativePath || files[0].name).replace(/\\/g,"/").split("/")[0];
  state.rootLabel = first || "";

  setTimeout(()=>{
    try {
      const { users, loginUsersFile } = scanSteamUsers(map);
      state.users = users;
      state.loginUsersFile = loginUsersFile;
      const finishAndLoad = ()=>{
        renderAll();
        if(state.users.length){
          $("#sourceSelect").value = "user:0";
          loadSelectedSource().finally(hideOverlay);
        } else {
          showToast("没有找到 Steam 账户（userdata/<id>/730/local/cfg）", 4000);
          hideOverlay();
        }
      };
      if(loginUsersFile && users.length){
        readTextWithFallback(loginUsersFile).then(text=>{
          try {
            const data = new VDFParser(text).parse();
            const usersData = findSection(data, "users");
            if(usersData && typeof usersData === "object"){
              for(const [steamid64, info] of Object.entries(usersData)){
                if(!info || typeof info !== "object") continue;
                const accountId = steamId64ToAccountId(steamid64);
                const persona = info.PersonaName || "";
                const account = info.AccountName || "";
                for(const u of users){
                  if(u.account_id === accountId && (persona || account)){
                    u.display = persona + " (" + account + ") [" + accountId + "]";
                  }
                }
              }
            }
          } catch(_) {}
          finishAndLoad();
        }).catch(finishAndLoad);
      } else {
        finishAndLoad();
      }
    } catch(e){
      showToast("扫描失败：" + (e.message || e), 4000);
      hideOverlay();
    }
  }, 30);
}
function handleManualFiles(fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  showOverlay("正在解析手动选择的文件…");
  setTimeout(async ()=>{
    try {
      const entries = files.map(f=>({ name: f.name, file: f }));
      await applyVcfgSource(entries, "手动文件（" + files.length + " 个）");
      state.users = [];
      renderPath();
      const sel = $("#sourceSelect");
      sel.innerHTML = '<option value="">— 已加载手动文件 —</option>';
      showToast("已载入 " + files.length + " 个文件");
    } catch(e){
      showToast("解析失败：" + (e.message || e), 4000);
    } finally {
      hideOverlay();
    }
  }, 30);
}
function handleAutoexecFile(file){
  if(!file) return;
  state.autoexecFile = file;
  renderSourceSelect();
  renderPath();
  $("#sourceSelect").value = "autoexec";
  loadSelectedSource();
}

/* ============================================================
 * 联网翻译（描述增强）
 * ============================================================ */
const MYMEMORY_API = "https://api.mymemory.translated.net/get";
async function translateOne(text, token, context){
  if(!text) return null;
  let query;
  if(context){
    query = context + " (" + text.replace(/^[+-]+/, "") + ")";
  } else {
    query = text.trim().replace(/^[+-]+/, "").trim();
  }
  if(!query) return null;
  const cacheKey = query;
  if(state.online.cache.has(cacheKey)) return state.online.cache.get(cacheKey);
  try {
    const url = MYMEMORY_API + "?q=" + encodeURIComponent(query)
              + "&langpair=en%7Czh-CN";
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 6000);
    const resp = await fetch(url, { signal: ctrl.signal });
    clearTimeout(t);
    if(!resp.ok) return null;
    const data = await resp.json();
    if(token !== state.online.threadToken || state.online.cancelled) return null;
    let result = data && data.responseData && data.responseData.translatedText;
    if(!result || String(result).startsWith("MYMEMORY WARNING")) return null;
    if(context){
      result = String(result).replace(/\s*[（(][^（）()]*[）)]\s*$/, "").trim();
    }
    if(result){
      state.online.cache.set(cacheKey, result);
      return result;
    }
  } catch(_){ /* 网络失败 */ }
  return null;
}
function collectPending(){
  const src = state.source;
  if(!src) return [];
  const pending = [];
  for(let i=0;i<src.key.length;i++){
    const [, k, v] = src.key[i];
    if(!translateKeyLocal(k))
      pending.push({ kind:"key", idx:i, field:"key_cn", text:k, context:null });
    if(!translateCmdLocal(v)){
      const vStr = String(v || "");
      const baseCmd = vStr.trim().split(/\s+/)[0].toLowerCase();
      const desc = CONVAR_DESC_EN[baseCmd] || CONVAR_DESC_EN[vStr.toLowerCase()] || null;
      pending.push({ kind:"key", idx:i, field:"value_cn", text:v, context:desc });
    }
  }
  for(let i=0;i<src.video.length;i++){
    const [k] = src.video[i];
    if(lookupDescCN(k)) continue;
    if(!translateVideoKeyLocal(k)){
      const desc = lookupDescEN(k);
      pending.push({
        kind:"video", idx:i, field:"key_cn",
        text: cleanVideoKeyForTranslation(k),
        context: desc
      });
    }
  }
  return pending;
}
async function startOnline(){
  if(!state.source){ showToast("还没有载入任何配置"); return; }
  if(state.online.running){ showToast("已经在运行"); return; }
  const pending = collectPending();
  if(!pending.length){
    showToast("本地字典/描述库已全部收录，无需联网翻译");
    $("#onlineProgress").textContent = "0/0";
    return;
  }
  state.online.running = true;
  state.online.cancelled = false;
  state.online.done = 0;
  state.online.total = pending.length;
  state.online.pending = pending;
  state.online.threadToken++;
  const myToken = state.online.threadToken;
  $("#btnStartOnline").disabled = true;
  $("#btnStopOnline").disabled = false;
  $("#onlineProgress").textContent = "0/" + state.online.total;
  for(let i=0;i<pending.length;i++){
    if(state.online.cancelled || myToken !== state.online.threadToken){
      state.online.running = false;
      $("#btnStartOnline").disabled = false;
      $("#btnStopOnline").disabled = true;
      return;
    }
    const item = pending[i];
    const result = await translateOne(item.text, myToken, item.context);
    if(state.online.cancelled || myToken !== state.online.threadToken){
      state.online.running = false;
      $("#btnStartOnline").disabled = false;
      $("#btnStopOnline").disabled = true;
      return;
    }
    if(result){
      if(item.kind === "key"){
        const row = state.source.key[item.idx];
        if(item.field === "key_cn") row[2] = result;
        else row[3] = result;
      } else {
        state.source.video[item.idx][2] = result;
      }
      state.view = buildView(state.source);
      if(item.kind === "key") renderKeys();
      else renderVideo();
      updateSummary();
    }
    state.online.done++;
    $("#onlineProgress").textContent = state.online.done + "/" + state.online.total;
  }
  state.online.running = false;
  $("#btnStartOnline").disabled = false;
  $("#btnStopOnline").disabled = true;
  showToast("联网翻译完成：" + state.online.done + "/" + state.online.total);
}
function stopOnline(){
  if(!state.online.running) return;
  state.online.cancelled = true;
  state.online.threadToken++;
  state.online.running = false;
  $("#btnStartOnline").disabled = false;
  $("#btnStopOnline").disabled = true;
  showToast("已停止联网翻译");
}

/* ============================================================
 * cvarlist.md 导入
 * ============================================================ */
async function importCvarlist(file){
  if(!file) return;
  showOverlay("正在解析 cvarlist.md…");
  try {
    const text = await readTextWithFallback(file);
    const extra = parseCvarlistMarkdown(text);
    let count = 0;
    for(const [k, v] of Object.entries(extra)){
      if(!CONVAR_DESC_EN[k]){ CONVAR_DESC_EN[k] = v; count++; }
    }
    showToast("已导入 " + count + " 条英文描述（总计 " +
              Object.keys(CONVAR_DESC_EN).length + " 条）");
    if(state.source){
      state.view = buildView(state.source);
      renderAll();
    }
  } catch(e){
    showToast("导入失败：" + (e.message || e), 4000);
  } finally {
    hideOverlay();
  }
}

/* ============================================================
 * 事件绑定
 * ============================================================ */
function bindEvents(){
  $("#btnPickDir").addEventListener("click", ()=>{
    $("#dirInput").value = "";
    $("#dirInput").click();
  });
  $("#dirInput").addEventListener("change", e=>{
    handleDirFiles(e.target.files);
  });
  $("#btnPickFiles").addEventListener("click", ()=>{
    $("#filesInput").value = "";
    $("#filesInput").click();
  });
  $("#filesInput").addEventListener("change", e=>{
    handleManualFiles(e.target.files);
  });
  $("#btnImportAutoexec").addEventListener("click", ()=>{
    $("#autoexecInput").value = "";
    $("#autoexecInput").click();
  });
  $("#autoexecInput").addEventListener("change", e=>{
    const f = e.target.files && e.target.files[0];
    if(f) handleAutoexecFile(f);
  });
  $("#btnImportCvarlist").addEventListener("click", ()=>{
    $("#cvarlistInput").value = "";
    $("#cvarlistInput").click();
  });
  $("#cvarlistInput").addEventListener("change", e=>{
    const f = e.target.files && e.target.files[0];
    if(f) importCvarlist(f);
  });
  $("#btnReload").addEventListener("click", ()=>{
    loadSelectedSource();
  });
  $("#sourceSelect").addEventListener("change", ()=>{
    loadSelectedSource();
  });
  $("#search").addEventListener("input", e=>{
    state.search = e.target.value.trim();
    renderKeys();
    renderVideo();
  });
  document.querySelectorAll(".tabs button[data-tab]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".tabs button[data-tab]").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      state.currentTab = btn.dataset.tab;
      $("#tab-" + state.currentTab).classList.add("active");
    });
  });
  $("#btnStartOnline").addEventListener("click", startOnline);
  $("#btnStopOnline").addEventListener("click", stopOnline);
}

/* ============================================================
 * 启动
 * ============================================================ */
bindEvents();
renderAll();
</script>
