# 文件路径: .github/workflows/deploy-pages.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]   # 当 main 分支有推送时触发
  workflow_dispatch:      # 允许手动在 Actions 标签页触发

# 设置 GITHUB_TOKEN 的权限，允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署，跳过在进行中的运行，但不要取消进行中的运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 指定要发布的文件夹路径。这里设为根目录，它会自动上传所有内容
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
